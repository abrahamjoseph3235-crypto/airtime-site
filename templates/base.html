<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Airtime Reward{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top"><a href="{{ url_for('index') }}">Airtime Reward</a></header>
  <main>
    {% block steps %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <footer>We use your phone number and screenshots to review reward applications, prevent duplicate submissions, and coordinate approved rewards manually.</footer>
</body>
</html>
